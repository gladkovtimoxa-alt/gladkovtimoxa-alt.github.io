<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KaTiAi">
  <defs>
    <linearGradient id="kt-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5E7E"/>
      <stop offset=".55" stop-color="#9B7BFF"/>
      <stop offset="1" stop-color="#3DF5C8"/>
    </linearGradient>
    <linearGradient id="kt-pupil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3DF5C8"/>
      <stop offset="1" stop-color="#9B7BFF"/>
    </linearGradient>
  </defs>
  <!-- squircle head with two cat-ear notches -->
  <path d="M8 22 L8 12 L18 18 Q32 14 46 18 L56 12 L56 22 Q60 32 56 44 Q52 58 32 58 Q12 58 8 44 Q4 32 8 22 Z" fill="url(#kt-body)"/>
  <!-- almond eye = sheet of paper being read -->
  <path d="M14 37 Q32 21 50 37 Q32 53 14 37 Z" fill="#F6F3EE"/>
  <!-- vertical slit pupil = scan beam -->
  <rect x="29.5" y="27" width="5" height="20" rx="2.5" fill="url(#kt-pupil)"/>
  <rect x="31.2" y="24" width="1.6" height="26" rx=".8" fill="#0B0A12" opacity=".55"/>
</svg>
